[project]
name = "coco-fora"
dependencies = [
  "cocotb>=1.9.2",
  "pytest>=8.3.4",
  "forastero >= 1.0,<1.1",
  "forastero-io",
  "icecream>=2.1.4",
]
version = "0.1.0"
description = "Examples"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
forastero-io = { path = "./forastero-io", editable = true }

[dependency-groups]
dev = ["ruff>=0.11.5", "forastero-io"]
